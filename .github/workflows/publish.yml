name: Publish site

# Builds the hosted tracker (site/build.py) from this repo plus the hourly collector's data (downloaded from its
# read-only Google Apps Script feed by site/fetch_ccu.py) and deploys it to GitHub Pages. A short job on a plain
# schedule: it never starts itself again (GitHub disabled Lazlo25/roblox-ccu on Nov 24, 2026, most likely for using
# Actions as an always-on service). It also runs on every push to main and after the daily snapshot. A missed scheduled
# run just means the page updates later; it warns when its data is more than 3 hours old. From 1 PM Eastern it also
# starts the Daily snapshot when today's hasn't been recorded (nothing waits inside a job).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily snapshot"]
    types: [completed]
  schedule:
    - cron: '25 * * * *'   # hourly; the collector also runs hourly (at a minute Google picks), so data can lag up to an hour
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write           # lets the job start the Daily snapshot

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Start today's daily snapshot if it hasn't run yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(TZ=America/New_York date +%F); H=$((10#$(TZ=America/New_York date +%H)))
          busy=$(gh run list -w daily.yml -L 5 -R "$GITHUB_REPOSITORY" --json status -q '[.[]|select(.status!="completed")]|length')
          if [ ! -f "db-copy/days/$D.json" ] && [ "$H" -ge 13 ] && [ "$busy" = 0 ]; then
            gh workflow run daily.yml --ref main -R "$GITHUB_REPOSITORY" && echo "Started Daily snapshot for $D"
          fi

      - name: Download the collector's data
        run: python3 site/fetch_ccu.py --out ccu

      - name: Build
        run: python3 site/build.py --ccu ccu --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
