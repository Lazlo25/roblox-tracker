name: Publish site

# Builds the hosted tracker (site/build.py) from this repo plus the hourly collector's data (downloaded from its
# read-only Google Apps Script feed by site/fetch_ccu.py) and deploys it to GitHub Pages. A short job on a plain
# schedule: it never starts itself again (GitHub disabled Lazlo25/roblox-ccu on Nov 24, 2026, most likely for using
# Actions as an always-on service). It also runs on every push to main, which includes the daily snapshot that a Mac
# launchd job (com.lewiswilson.roblox-daily) records at 1 PM Eastern and pushes. A missed scheduled run just means the
# page updates later; it warns when its data is more than 3 hours old.
on:
  push:
    branches: [main]
  schedule:
    - cron: '25 * * * *'   # hourly; the collector also runs hourly (at a minute Google picks), so data can lag up to an hour
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the collector's data
        run: python3 site/fetch_ccu.py --out ccu

      - name: Build
        run: python3 site/build.py --ccu ccu --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
