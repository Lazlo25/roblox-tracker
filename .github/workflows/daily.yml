name: Daily snapshot

# Started by the 4-hourly Claude cloud routine, which pushes trigger/daily.txt in the morning (push events start
# reliably); the job then waits until 1 PM Eastern. GitHub's own schedule below is only a backstop, because it can lag
# by hours on small repos.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['trigger/daily.txt']
  schedule:
    - cron: '30 17,18 * * *'

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - name: Pick the Eastern date
        id: day
        run: |
          D=$(TZ=America/New_York date +%F)
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "prev=$(TZ=America/New_York date -d "$D -1 day" +%F)" >> "$GITHUB_OUTPUT"
          if [ -f "db-copy/days/$D.json" ]; then echo "done=1" >> "$GITHUB_OUTPUT"; echo "Already recorded for $D"; fi
          # Before 1 PM Eastern: wait for it when it's under 5 hours away, otherwise leave it to a later trigger.
          wait=$(( $(TZ=America/New_York date -d "$D 13:00" +%s) - $(date +%s) ))
          if [ "$wait" -gt 18000 ]; then echo "early=1" >> "$GITHUB_OUTPUT"; echo "More than 5 hours before 1 PM Eastern: nothing to do"
          elif [ "$wait" -gt 0 ]; then echo "Waiting $wait s for 1 PM Eastern"; echo "wait=$wait" >> "$GITHUB_OUTPUT"; fi

      - name: Wait for 1 PM Eastern
        if: steps.day.outputs.wait != '' && steps.day.outputs.done != '1'
        run: sleep ${{ steps.day.outputs.wait }}

      - name: Install Pillow (contact sheets)
        if: steps.day.outputs.done != '1' && steps.day.outputs.early != '1'
        run: pip install --quiet pillow

      - name: Snapshot the public charts
        if: steps.day.outputs.done != '1' && steps.day.outputs.early != '1'
        run: python3 tracker.py prepare --dump db-copy --out "db-copy/days/${{ steps.day.outputs.date }}.json" --date "${{ steps.day.outputs.date }}"

      - name: Finalize yesterday's CCU with its full-day average
        if: steps.day.outputs.done != '1' && steps.day.outputs.early != '1'
        continue-on-error: true
        run: |
          P="${{ steps.day.outputs.prev }}"
          python3 tracker.py refresh --date "$P" --dump db-copy --out "/tmp/prev.json" && mv /tmp/prev.json "db-copy/days/$P.json"

      - name: Collect page data and build the gameplay-profiling queue
        if: steps.day.outputs.done != '1' && steps.day.outputs.early != '1'
        run: python3 analyze.py collect --date "${{ steps.day.outputs.date }}"

      - name: Commit, and publish today's contact sheets on the sheets branch
        if: steps.day.outputs.done != '1' && steps.day.outputs.early != '1'
        run: |
          D="${{ steps.day.outputs.date }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db-copy profiles analysis work
          git commit -q -m "Snapshot $D" || true
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
          git worktree add --orphan -b sheets /tmp/sheets
          cp work/"$D"/sheet_*.jpg /tmp/sheets/ 2>/dev/null || true
          git -C /tmp/sheets add -A
          git -C /tmp/sheets commit -q -m "Contact sheets $D" || true
          git -C /tmp/sheets push -q -f origin sheets
