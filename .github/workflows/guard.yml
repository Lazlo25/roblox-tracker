name: Repo guard

# Every 2 hours: scan both tracker repos, every branch, for personal info and
# credentials (tools/privacy_scan.py; personal terms are stored only as hashes); findings fail this job, which emails
# the repo owner. If the repo has become private it only reports it: it no longer makes it public again (turned off on
# 2026-11-26 while GitHub Support reviews Lazlo25/roblox-ccu, so it can never reverse a change made by GitHub staff).
# Reading a private repo needs a fine-grained token with Administration: Read on it, saved as the Actions secret
# VISIBILITY_TOKEN (the built-in GITHUB_TOKEN can't do it).
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: read

concurrency:
  group: guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Scan both repos; re-publish a private one only if it is clean
        env:
          ADMIN: ${{ secrets.VISIBILITY_TOKEN }}
          BUILTIN: ${{ github.token }}
        run: |
          status=0
          for r in roblox-tracker; do  # roblox-ccu was disabled by GitHub on Nov 24, 2026
            tok="${ADMIN:-$BUILTIN}"
            vis=$(GH_TOKEN="$tok" gh repo view "Lazlo25/$r" --json visibility -q .visibility 2>/dev/null || echo UNREADABLE)
            echo "Lazlo25/$r: $vis"
            if [ "$vis" = "UNREADABLE" ]; then
              echo "::error::Lazlo25/$r can't be read (made private?) and VISIBILITY_TOKEN isn't set, so it can't be checked or re-published"
              status=1; continue
            fi
            if [ -n "$ADMIN" ]; then  # proves VISIBILITY_TOKEN still works and has Administration access (catches expiry)
              GH_TOKEN="$ADMIN" gh api "repos/Lazlo25/$r/actions/permissions" >/dev/null && echo "VISIBILITY_TOKEN: admin access to $r ok" \
                || { echo "::error::VISIBILITY_TOKEN can't administer Lazlo25/$r (expired, or Administration permission missing)"; status=1; }
            fi
            rm -rf "/tmp/$r" && git init -q "/tmp/$r"
            git -C "/tmp/$r" fetch -q --depth 1 "https://x-access-token:$tok@github.com/Lazlo25/$r" '+refs/heads/*:refs/remotes/origin/*'
            if [ "$vis" = "PRIVATE" ]; then
              echo "::error::Lazlo25/$r is private; this job no longer makes it public again, so check why it changed"; status=1
            fi
            if ! python3 tools/privacy_scan.py "/tmp/$r"; then
              echo "::error::Lazlo25/$r has findings (listed above by location only)"; status=1
            fi
          done
          exit $status
